name: Release

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时触发打包（例如 v1.0.0）
  workflow_dispatch: # 也可在 Actions 页面手动触发

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false # 一个平台失败不阻塞其他平台
      matrix:
        include:
          # macOS：Apple Silicon 与 Intel 各打一份
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # Linux：Tauri 2 需要 WebKit2GTK 4.1
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两种架构的 target 只在 mac runner 上安装，避免拖慢 Linux/Windows
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Cargo 依赖与构建产物，加快后续构建
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 2 在 Linux 上的系统依赖
      # 注意：是 webkit2gtk-4.1（不是 Tauri 1 的 4.0）与 ayatana-appindicator
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # 使用 Tauri 官方 Action 打包并上传到 GitHub Release
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名与公证（未配置 secrets 时 tauri-action 自动跳过，不影响 Linux/Windows）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__ # Release 的 tag 名（如 v1.0.0）
          releaseName: 'RestReminder v__VERSION__'
          releaseBody: '自动打包构建，请核对后再发布。'
          releaseDraft: true # 先打成草稿，方便人工检查
          prerelease: false
          generateReleaseNotes: true # 自动生成更新说明
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true # 构建产物同时挂到 Actions 运行页
