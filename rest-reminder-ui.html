<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rest Reminder — 桌面应用原型</title>
<style>
  :root {
    --bg:      oklch(99% 0.002 240);
    --surface: oklch(100% 0 0);
    --fg:      oklch(18% 0.012 250);
    --muted:   oklch(54% 0.012 250);
    --border:  oklch(92% 0.005 250);
    --accent:  oklch(58% 0.18 255);

    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-mono:    'SF Mono', ui-monospace, Menlo, Consolas, monospace;

    --ok:      oklch(58% 0.14 155);
    --warn:    oklch(68% 0.14 75);
    --rest:    oklch(56% 0.12 170);
    --radius:  12px;
    --shadow:  0 1px 2px oklch(18% 0.012 250 / 0.04), 0 8px 24px oklch(18% 0.012 250 / 0.06);
    --shadow-lg: 0 2px 4px oklch(18% 0.012 250 / 0.04), 0 16px 48px oklch(18% 0.012 250 / 0.10);
    --shadow-toast: 0 8px 28px oklch(18% 0.012 250 / 0.14), 0 2px 6px oklch(18% 0.012 250 / 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  /* —— Desktop canvas —— */
  .desktop {
    min-height: 100vh;
    padding: 40px 32px 100px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, oklch(96% 0.01 250), transparent 60%),
      var(--bg);
  }

  .desktop-header {
    max-width: 420px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .desktop-header h1 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .desktop-header p {
    font-size: 13px;
    color: var(--muted);
  }
  .stage-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage {
    max-width: 420px;
    margin: 0 auto;
  }

  /* —— Window chrome —— */
  .win {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .win-titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in oklch, var(--surface) 92%, var(--bg));
    user-select: none;
  }
  .traffic {
    display: flex;
    gap: 6px;
  }
  .traffic span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
  }
  .traffic .c1 { background: oklch(72% 0.12 25); }
  .traffic .c2 { background: oklch(78% 0.12 85); }
  .traffic .c3 { background: oklch(70% 0.12 145); }
  .win-title {
    flex: 1;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-right: 40px;
  }

  /* —— Main window —— */
  .main-win { min-height: 560px; }
  .main-body {
    padding: 28px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mode-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .mode-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .mode-pill.is-work .dot { background: var(--accent); }
  .mode-pill.is-work { color: var(--fg); border-color: color-mix(in oklch, var(--accent) 30%, var(--border)); background: color-mix(in oklch, var(--accent) 6%, var(--surface)); }
  .mode-pill.is-rest .dot { background: var(--rest); }
  .mode-pill.is-rest { color: var(--fg); border-color: color-mix(in oklch, var(--rest) 30%, var(--border)); background: color-mix(in oklch, var(--rest) 7%, var(--surface)); }
  .mode-pill.is-idle .dot { background: var(--muted); }

  .session-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Timer ring */
  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 0 4px;
  }
  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .ring-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: var(--border);
    stroke-width: 6;
  }
  .ring-prog {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.35s linear, stroke 0.25s ease;
  }
  .ring-wrap.is-rest .ring-prog { stroke: var(--rest); }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .time-display {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .time-caption {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .progress-pct {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 550;
    height: 40px;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover { background: var(--bg); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible {
    outline: 2px solid color-mix(in oklch, var(--accent) 50%, transparent);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent);
    border-color: color-mix(in oklch, var(--accent) 80%, black);
    color: white;
    min-width: 112px;
    box-shadow: 0 1px 2px oklch(40% 0.12 255 / 0.25);
  }
  .btn-primary:hover {
    background: color-mix(in oklch, var(--accent) 88%, black);
  }
  .btn-primary.is-rest-mode {
    background: var(--rest);
    border-color: color-mix(in oklch, var(--rest) 80%, black);
    box-shadow: 0 1px 2px oklch(40% 0.1 170 / 0.25);
  }
  .btn-primary.is-rest-mode:hover {
    background: color-mix(in oklch, var(--rest) 88%, black);
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
  }
  .btn-ghost:hover { color: var(--fg); background: var(--bg); }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn svg { width: 14px; height: 14px; }

  /* Settings card */
  .settings {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .setting-row {
    display: grid;
    grid-template-columns: 72px 1fr 48px;
    align-items: center;
    gap: 12px;
  }
  .setting-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
  }
  .setting-val {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid color-mix(in oklch, var(--accent) 50%, var(--border));
    box-shadow: 0 1px 3px oklch(18% 0.012 250 / 0.12);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid color-mix(in oklch, var(--accent) 50%, var(--border));
    box-shadow: 0 1px 3px oklch(18% 0.012 250 / 0.12);
    cursor: pointer;
  }
  input[type="range"]:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }
  .toggle-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .toggle-label strong {
    font-size: 13px;
    font-weight: 550;
  }
  .toggle-label span {
    font-size: 12px;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--border);
    cursor: pointer;
    transition: background 0.2s;
  }
  .switch-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 1px 3px oklch(18% 0.012 250 / 0.15);
    transition: transform 0.2s;
  }
  .switch input:checked + .switch-track {
    background: var(--accent);
  }
  .switch input:checked + .switch-track::after {
    transform: translateX(16px);
  }
  .switch input:focus-visible + .switch-track {
    outline: 2px solid color-mix(in oklch, var(--accent) 50%, transparent);
    outline-offset: 2px;
  }

  .stage-foot {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
  }

  /* —— Bottom-right reminder toast —— */
  .reminder-win {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 340px;
    z-index: 60;
    border-radius: 14px;
    box-shadow: var(--shadow-toast);
    transform-origin: bottom right;
    transition:
      opacity 0.28s ease,
      transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
      visibility 0.28s;
  }
  .reminder-win.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(14px) scale(0.96);
  }
  .reminder-win.is-active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    box-shadow:
      var(--shadow-toast),
      0 0 0 1px color-mix(in oklch, var(--rest) 16%, transparent);
  }
  .reminder-win .win-titlebar {
    height: 36px;
    padding: 0 12px;
  }
  .reminder-win .win-title {
    margin-right: 28px;
    font-size: 11px;
  }
  .reminder-win .traffic span {
    width: 8px;
    height: 8px;
  }
  .reminder-body {
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .reminder-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .reminder-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: color-mix(in oklch, var(--rest) 10%, var(--bg));
    border: 1px solid color-mix(in oklch, var(--rest) 18%, var(--border));
    display: grid;
    place-items: center;
  }
  .reminder-icon svg {
    width: 18px;
    height: 18px;
    color: var(--rest);
  }
  .reminder-copy {
    flex: 1;
    min-width: 0;
    padding-top: 1px;
  }
  .reminder-copy h2 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .reminder-copy p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .reminder-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .reminder-actions .btn {
    width: 100%;
    height: 36px;
    font-size: 12.5px;
    padding: 0 10px;
  }
  .btn-rest {
    background: var(--rest);
    border-color: color-mix(in oklch, var(--rest) 80%, black);
    color: white;
    box-shadow: 0 1px 2px oklch(40% 0.1 170 / 0.2);
  }
  .btn-rest:hover {
    background: color-mix(in oklch, var(--rest) 88%, black);
  }
  .snooze-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    min-height: 0;
  }
  .snooze-note:empty { display: none; }

  /* Status toast — center, above bottom edge so it doesn't fight the corner popup */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--fg);
    color: var(--surface);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
    box-shadow: var(--shadow-lg);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Tweaks — bottom-left, clear of corner reminder */
  .tweaks {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 40;
  }
  .tweaks details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    width: 220px;
    overflow: hidden;
  }
  .tweaks summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    user-select: none;
  }
  .tweaks summary::-webkit-details-marker { display: none; }
  .tweaks-body {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .tweaks-body label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .tweaks-body select {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    padding: 0 8px;
  }

  @media (max-width: 480px) {
    .desktop { padding: 24px 16px 120px; }
    .reminder-win {
      right: 12px;
      bottom: 12px;
      width: calc(100vw - 24px);
      max-width: 340px;
    }
    .reminder-actions {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="desktop" data-od-id="desktop-canvas">
    <header class="desktop-header" data-od-id="desktop-header">
      <div>
        <div class="stage-label">Tauri · Desktop prototype</div>
        <h1>Rest Reminder</h1>
      </div>
      <p>安静的专注计时 · 右下角轻提醒</p>
    </header>

    <div class="stage">
      <!-- Main window -->
      <section class="win main-win" data-od-id="main-window" aria-label="主窗口">
        <div class="win-titlebar" data-od-id="main-titlebar">
          <div class="traffic" aria-hidden="true"><span class="c1"></span><span class="c2"></span><span class="c3"></span></div>
          <div class="win-title">Rest Reminder</div>
        </div>

        <div class="main-body">
          <div class="mode-row">
            <div id="modePill" class="mode-pill is-idle" data-od-id="mode-pill">
              <span class="dot"></span>
              <span id="modeText">待开始</span>
            </div>
            <div class="session-meta" id="sessionMeta" data-od-id="session-meta">第 0 轮</div>
          </div>

          <div class="timer-block" data-od-id="timer-block">
            <div class="ring-wrap" id="ringWrap">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle class="ring-track" cx="50" cy="50" r="44" />
                <circle class="ring-prog" id="ringProg" cx="50" cy="50" r="44"
                  stroke-dasharray="276.46" stroke-dashoffset="0" />
              </svg>
              <div class="ring-center">
                <div class="time-display" id="timeDisplay" data-od-id="time-display">25:00</div>
                <div class="time-caption" id="timeCaption">工作时长</div>
              </div>
            </div>
            <div class="progress-pct" id="progressPct" data-od-id="progress-pct">进度 0%</div>
          </div>

          <div class="controls" data-od-id="controls">
            <button type="button" class="btn btn-primary" id="btnPrimary" data-od-id="btn-start">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5-9-5.5z"/></svg>
              <span>开始</span>
            </button>
            <button type="button" class="btn" id="btnReset" data-od-id="btn-reset" disabled>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M3 8a5 5 0 0 1 8.5-3.5M13 3v3.5H9.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13 8a5 5 0 0 1-8.5 3.5M3 13v-3.5H6.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              重置
            </button>
          </div>

          <div class="settings" data-od-id="settings">
            <div class="setting-row">
              <label class="setting-label" for="workRange">工作</label>
              <input type="range" id="workRange" min="5" max="90" step="5" value="25" data-od-id="work-slider" />
              <span class="setting-val" id="workVal">25 分</span>
            </div>
            <div class="setting-row">
              <label class="setting-label" for="restRange">休息</label>
              <input type="range" id="restRange" min="1" max="30" step="1" value="5" data-od-id="rest-slider" />
              <span class="setting-val" id="restVal">5 分</span>
            </div>
            <div class="toggle-row">
              <div class="toggle-label">
                <strong>提示音</strong>
                <span>到点时播放轻提示</span>
              </div>
              <label class="switch" data-od-id="sound-toggle">
                <input type="checkbox" id="soundToggle" checked />
                <span class="switch-track"></span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <p class="stage-foot" id="reminderHint" data-od-id="reminder-hint">工作结束后将从右下角弹出提醒</p>
    </div>
  </div>

  <!-- Bottom-right reminder popup -->
  <section class="win reminder-win is-hidden" id="reminderWin" data-od-id="reminder-window" aria-label="休息提醒" aria-live="polite" role="alertdialog" aria-modal="false">
    <div class="win-titlebar">
      <div class="traffic" aria-hidden="true"><span class="c1"></span><span class="c2"></span><span class="c3"></span></div>
      <div class="win-title">休息提醒</div>
    </div>
    <div class="reminder-body">
      <div class="reminder-top">
        <div class="reminder-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </div>
        <div class="reminder-copy">
          <h2 data-od-id="reminder-title">该休息一下了</h2>
          <p id="reminderDesc">你已专注完成一轮工作，站起来活动几分钟会更好。</p>
        </div>
      </div>
      <div class="reminder-actions">
        <button type="button" class="btn btn-rest" id="btnStartRest" data-od-id="btn-start-rest">开始休息</button>
        <button type="button" class="btn" id="btnSnooze" data-od-id="btn-snooze">稍后 · 5 分</button>
      </div>
      <div class="snooze-note" id="snoozeNote"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <div class="tweaks" data-od-id="tweaks-panel">
    <details>
      <summary>Tweaks</summary>
      <div class="tweaks-body">
        <label>
          演示加速
          <select id="tweakSpeed">
            <option value="1">实时（1×）</option>
            <option value="30" selected>快进 30×</option>
            <option value="60">快进 60×</option>
          </select>
        </label>
        <label>
          预览提醒窗
          <select id="tweakReminder">
            <option value="auto" selected>自动（到点）</option>
            <option value="show">始终显示</option>
            <option value="hide">隐藏</option>
          </select>
        </label>
      </div>
    </details>
  </div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  speed: 30,
  reminderPreview: "auto"
}/*EDITMODE-END*/;

(function () {
  const CIRC = 2 * Math.PI * 44;

  const el = {
    modePill: document.getElementById("modePill"),
    modeText: document.getElementById("modeText"),
    sessionMeta: document.getElementById("sessionMeta"),
    ringWrap: document.getElementById("ringWrap"),
    ringProg: document.getElementById("ringProg"),
    timeDisplay: document.getElementById("timeDisplay"),
    timeCaption: document.getElementById("timeCaption"),
    progressPct: document.getElementById("progressPct"),
    btnPrimary: document.getElementById("btnPrimary"),
    btnReset: document.getElementById("btnReset"),
    workRange: document.getElementById("workRange"),
    restRange: document.getElementById("restRange"),
    workVal: document.getElementById("workVal"),
    restVal: document.getElementById("restVal"),
    soundToggle: document.getElementById("soundToggle"),
    reminderWin: document.getElementById("reminderWin"),
    reminderHint: document.getElementById("reminderHint"),
    reminderDesc: document.getElementById("reminderDesc"),
    btnStartRest: document.getElementById("btnStartRest"),
    btnSnooze: document.getElementById("btnSnooze"),
    snoozeNote: document.getElementById("snoozeNote"),
    toast: document.getElementById("toast"),
    tweakSpeed: document.getElementById("tweakSpeed"),
    tweakReminder: document.getElementById("tweakReminder"),
  };

  el.ringProg.style.strokeDasharray = String(CIRC);

  const state = {
    phase: "idle", // idle | work | rest | paused | reminding
    pausedFrom: null,
    remainingMs: 25 * 60 * 1000,
    totalMs: 25 * 60 * 1000,
    workMin: 25,
    restMin: 5,
    rounds: 0,
    timerId: null,
    lastTick: null,
    sound: true,
    speed: TWEAK_DEFAULTS.speed,
    reminderPreview: TWEAK_DEFAULTS.reminderPreview,
    snoozeUntil: null,
  };

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
  }

  function showToast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      el.toast.classList.remove("show");
    }, 1800);
  }

  function playBeep() {
    if (!state.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [0, 0.18].forEach(function (delay, i) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i === 0 ? 660 : 880;
        g.gain.setValueAtTime(0.0001, now + delay);
        g.gain.exponentialRampToValueAtTime(0.12, now + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.28);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + delay);
        o.stop(now + delay + 0.32);
      });
      setTimeout(function () { ctx.close(); }, 800);
    } catch (e) { /* ignore */ }
  }

  function setPrimaryButton(label, icon, restMode) {
    const span = el.btnPrimary.querySelector("span");
    const svg = el.btnPrimary.querySelector("svg");
    span.textContent = label;
    el.btnPrimary.classList.toggle("is-rest-mode", !!restMode);
    if (icon === "pause") {
      svg.innerHTML = '<rect x="3.5" y="2.5" width="3.5" height="11" rx="0.5" fill="currentColor"/><rect x="9" y="2.5" width="3.5" height="11" rx="0.5" fill="currentColor"/>';
    } else if (icon === "play") {
      svg.innerHTML = '<path d="M4 2.5v11l9-5.5-9-5.5z" fill="currentColor"/>';
    }
  }

  function updateRing() {
    const p = state.totalMs <= 0 ? 0 : 1 - state.remainingMs / state.totalMs;
    const offset = CIRC * (1 - Math.min(1, Math.max(0, p)));
    el.ringProg.style.strokeDashoffset = String(offset);
    el.progressPct.textContent = "进度 " + Math.round(p * 100) + "%";
  }

  function updateReminderVisibility() {
    const preview = state.reminderPreview;
    const shouldShow =
      preview === "show" ||
      (preview === "auto" && state.phase === "reminding");
    const forceHide = preview === "hide";

    if (forceHide || !shouldShow) {
      el.reminderWin.classList.add("is-hidden");
      el.reminderWin.classList.remove("is-active");
      if (state.phase === "reminding" && preview === "auto") {
        el.reminderHint.textContent = "提醒已触发（右下角）";
      } else if (preview === "hide") {
        el.reminderHint.textContent = "提醒窗已隐藏（Tweaks）";
      } else {
        el.reminderHint.textContent = "工作结束后将从右下角弹出提醒";
      }
    } else {
      el.reminderWin.classList.remove("is-hidden");
      el.reminderWin.classList.add("is-active");
      el.reminderHint.textContent = state.phase === "reminding" ? "右下角等待你的选择" : "预览模式 · 右下角";
    }
  }

  function render() {
    el.timeDisplay.textContent = fmt(state.remainingMs);
    el.workVal.textContent = state.workMin + " 分";
    el.restVal.textContent = state.restMin + " 分";
    el.sessionMeta.textContent = "第 " + state.rounds + " 轮";
    el.soundToggle.checked = state.sound;

    const isRest = state.phase === "rest" || (state.phase === "paused" && state.pausedFrom === "rest");
    el.ringWrap.classList.toggle("is-rest", isRest || state.phase === "reminding");

    el.modePill.classList.remove("is-idle", "is-work", "is-rest");
    if (state.phase === "work" || (state.phase === "paused" && state.pausedFrom === "work")) {
      el.modePill.classList.add("is-work");
      el.modeText.textContent = state.phase === "paused" ? "已暂停 · 工作" : "工作中";
      el.timeCaption.textContent = "工作倒计时";
    } else if (state.phase === "rest" || (state.phase === "paused" && state.pausedFrom === "rest")) {
      el.modePill.classList.add("is-rest");
      el.modeText.textContent = state.phase === "paused" ? "已暂停 · 休息" : "休息中";
      el.timeCaption.textContent = "休息倒计时";
    } else if (state.phase === "reminding") {
      el.modePill.classList.add("is-work");
      el.modeText.textContent = "待确认";
      el.timeCaption.textContent = "工作已完成";
    } else {
      el.modePill.classList.add("is-idle");
      el.modeText.textContent = "待开始";
      el.timeCaption.textContent = "工作时长";
    }

    if (state.phase === "idle") {
      setPrimaryButton("开始", "play", false);
      el.btnReset.disabled = true;
      el.workRange.disabled = false;
      el.restRange.disabled = false;
    } else if (state.phase === "work" || state.phase === "rest") {
      setPrimaryButton("暂停", "pause", state.phase === "rest");
      el.btnReset.disabled = false;
      el.workRange.disabled = true;
      el.restRange.disabled = true;
    } else if (state.phase === "paused") {
      setPrimaryButton("继续", "play", state.pausedFrom === "rest");
      el.btnReset.disabled = false;
      el.workRange.disabled = true;
      el.restRange.disabled = true;
    } else if (state.phase === "reminding") {
      setPrimaryButton("开始", "play", false);
      el.btnPrimary.disabled = true;
      el.btnReset.disabled = false;
      el.workRange.disabled = true;
      el.restRange.disabled = true;
    }

    if (state.phase !== "reminding") {
      el.btnPrimary.disabled = false;
    }

    el.reminderDesc.textContent =
      "本轮工作 " + state.workMin + " 分钟已结束。建议休息 " + state.restMin + " 分钟。";
    el.snoozeNote.textContent = state.snoozeUntil
      ? "已延后至稍后"
      : "";

    updateRing();
    updateReminderVisibility();
  }

  function stopTicker() {
    if (state.timerId) {
      cancelAnimationFrame(state.timerId);
      state.timerId = null;
    }
    state.lastTick = null;
  }

  function tick(ts) {
    if (!state.lastTick) state.lastTick = ts;
    const delta = (ts - state.lastTick) * state.speed;
    state.lastTick = ts;

    if (state.phase === "work" || state.phase === "rest") {
      state.remainingMs -= delta;
      if (state.remainingMs <= 0) {
        state.remainingMs = 0;
        onPhaseComplete();
        return;
      }
      render();
    }
    state.timerId = requestAnimationFrame(tick);
  }

  function startTicker() {
    stopTicker();
    state.timerId = requestAnimationFrame(tick);
  }

  function onPhaseComplete() {
    stopTicker();
    if (state.phase === "work") {
      playBeep();
      state.phase = "reminding";
      state.rounds += 1;
      showToast("工作结束 · 该休息了");
      render();
    } else if (state.phase === "rest") {
      playBeep();
      state.phase = "idle";
      state.totalMs = state.workMin * 60 * 1000;
      state.remainingMs = state.totalMs;
      showToast("休息结束 · 准备下一轮");
      render();
    }
  }

  function startWork() {
    state.phase = "work";
    state.totalMs = state.workMin * 60 * 1000;
    state.remainingMs = state.totalMs;
    state.snoozeUntil = null;
    startTicker();
    render();
  }

  function startRest() {
    state.phase = "rest";
    state.totalMs = state.restMin * 60 * 1000;
    state.remainingMs = state.totalMs;
    state.snoozeUntil = null;
    startTicker();
    showToast("休息开始");
    render();
  }

  function pause() {
    state.pausedFrom = state.phase;
    state.phase = "paused";
    stopTicker();
    render();
  }

  function resume() {
    state.phase = state.pausedFrom || "work";
    state.pausedFrom = null;
    startTicker();
    render();
  }

  function reset() {
    stopTicker();
    state.phase = "idle";
    state.pausedFrom = null;
    state.totalMs = state.workMin * 60 * 1000;
    state.remainingMs = state.totalMs;
    state.snoozeUntil = null;
    el.btnPrimary.disabled = false;
    showToast("已重置");
    render();
  }

  // Events
  el.btnPrimary.addEventListener("click", function () {
    if (state.phase === "idle") startWork();
    else if (state.phase === "work" || state.phase === "rest") pause();
    else if (state.phase === "paused") resume();
  });

  el.btnReset.addEventListener("click", reset);

  el.workRange.addEventListener("input", function () {
    state.workMin = Number(el.workRange.value);
    if (state.phase === "idle") {
      state.totalMs = state.workMin * 60 * 1000;
      state.remainingMs = state.totalMs;
    }
    render();
  });

  el.restRange.addEventListener("input", function () {
    state.restMin = Number(el.restRange.value);
    render();
  });

  el.soundToggle.addEventListener("change", function () {
    state.sound = el.soundToggle.checked;
    if (state.sound) playBeep();
    showToast(state.sound ? "提示音已开启" : "提示音已关闭");
  });

  el.btnStartRest.addEventListener("click", function () {
    if (state.phase === "reminding" || state.reminderPreview === "show") {
      startRest();
    }
  });

  el.btnSnooze.addEventListener("click", function () {
    stopTicker();
    state.phase = "work";
    state.totalMs = 5 * 60 * 1000;
    state.remainingMs = state.totalMs;
    state.snoozeUntil = Date.now() + 5 * 60 * 1000;
    startTicker();
    showToast("已延后 5 分钟");
    render();
  });

  el.tweakSpeed.value = String(TWEAK_DEFAULTS.speed);
  el.tweakReminder.value = TWEAK_DEFAULTS.reminderPreview;

  el.tweakSpeed.addEventListener("change", function () {
    state.speed = Number(el.tweakSpeed.value) || 1;
    showToast("速度 " + state.speed + "×");
  });

  el.tweakReminder.addEventListener("change", function () {
    state.reminderPreview = el.tweakReminder.value;
    render();
  });

  // init
  state.speed = Number(el.tweakSpeed.value) || 1;
  state.reminderPreview = el.tweakReminder.value;
  render();
})();
</script>
</body>
</html>
